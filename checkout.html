<!DOCTYPE html>
<html lang="en-NG">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — Let It Shine</title>
  <meta name="robots" content="noindex" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/sections.css" />

  <!-- Paystack Inline -->
  <script src="https://js.paystack.co/v1/inline.js" defer></script>
</head>
<body>

<!-- Nav -->
<header class="site-nav" role="banner">
  <div class="container">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo" aria-label="Let It Shine — back to home">
        <div class="nav-logo-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="4" fill="white"/><path d="M9 1v2M9 15v2M1 9h2M15 9h2M3.22 3.22l1.41 1.41M13.36 13.36l1.41 1.41M3.22 14.78l1.41-1.41M13.36 4.64l1.41-1.41" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>
        </div>
        Let It Shine
      </a>
      <a href="index.html" class="btn btn--ghost" style="font-size:var(--text-sm);">
        ← Back to site
      </a>
    </div>
  </div>
</header>
<div class="nav-spacer"></div>

<!-- Demo mode banner (hidden by default, shown when no Paystack key) -->
<div
  id="demo-banner"
  hidden
  role="alert"
  style="background:#FFF3CD;color:#856404;padding:var(--space-4) var(--content-pad);text-align:center;font-weight:var(--weight-semibold);font-size:var(--text-sm);"
></div>

<main class="section" style="padding-top:var(--space-10);">
  <div class="container">
    <div style="max-width:900px;margin-inline:auto;">
      <h1 style="margin-bottom:var(--space-8);">Complete your order</h1>

      <div style="display:grid;gap:var(--space-8);align-items:start;" id="checkout-layout">

        <!-- Order summary (built by checkout.js) -->
        <div id="order-summary" aria-label="Order summary">
          <div class="card">
            <div class="card__body">
              <p style="color:var(--color-ink-muted);">Loading order summary...</p>
            </div>
          </div>
        </div>

        <!-- Checkout form -->
        <div>
          <form id="checkout-form" novalidate aria-label="Delivery and contact details">
            <div class="card">
              <div class="card__body" style="display:flex;flex-direction:column;gap:var(--space-5);">
                <h2 style="font-size:var(--text-xl);margin-bottom:var(--space-2);">Your details</h2>

                <div class="form-group">
                  <label class="form-label" for="buyer-name">Full name <span aria-hidden="true" style="color:var(--color-error);">*</span></label>
                  <input type="text" id="buyer-name" class="form-input" required autocomplete="name" placeholder="Your full name" />
                </div>

                <div class="form-group">
                  <label class="form-label" for="buyer-phone">Phone number <span aria-hidden="true" style="color:var(--color-error);">*</span></label>
                  <input type="tel" id="buyer-phone" class="form-input" required autocomplete="tel" placeholder="08012345678" inputmode="tel" />
                </div>

                <div class="form-group">
                  <label class="form-label" for="buyer-email">
                    Email address
                    <span style="font-weight:400;color:var(--color-ink-faint);"> — optional, for your receipt</span>
                  </label>
                  <input type="email" id="buyer-email" class="form-input" autocomplete="email" placeholder="you@example.com" />
                </div>

                <div class="form-group">
                  <label class="form-label" for="delivery-state">Delivery state <span aria-hidden="true" style="color:var(--color-error);">*</span></label>
                  <select id="delivery-state" class="form-select" required>
                    <option value="">Select your state</option>
                  </select>
                </div>

                <div class="form-group">
                  <label class="form-label" for="buyer-address">Delivery address <span aria-hidden="true" style="color:var(--color-error);">*</span></label>
                  <input type="text" id="buyer-address" class="form-input" required autocomplete="street-address" placeholder="House number, street, area, city" />
                </div>

                <!-- Payment message (hidden by default) -->
                <div
                  id="pay-message"
                  hidden
                  role="alert"
                  style="background:var(--color-accent-bg);border:1px solid var(--color-accent);border-radius:var(--radius-md);padding:var(--space-4);font-size:var(--text-sm);color:var(--color-ink);"
                ></div>

                <button
                  type="button"
                  id="pay-btn"
                  class="btn btn--primary btn--lg"
                  style="width:100%;justify-content:center;"
                >
                  Pay now
                  <span class="btn-arrow" aria-hidden="true">
                    <svg width="12" height="12" viewBox="0 0 10 10" fill="none"><path d="M2 5h6M5 2l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  </span>
                </button>

                <p style="font-size:var(--text-xs);color:var(--color-ink-faint);text-align:center;">
                  Payments are processed securely by Paystack. Your card details are never stored on our server.
                  After payment, confirm your order on the Paystack dashboard.
                </p>
              </div>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>
</main>

<footer style="background:var(--color-dark-bg);color:var(--color-dark-muted);padding:var(--space-8) var(--content-pad);text-align:center;font-size:var(--text-sm);">
  <p>&copy; <script>document.write(new Date().getFullYear())</script> Let It Shine. All rights reserved.</p>
</footer>

<style>
  @media (min-width: 768px) {
    #checkout-layout { grid-template-columns: 1fr 1fr; }
  }
</style>

<script type="module" src="js/checkout.js"></script>

</body>
</html>
